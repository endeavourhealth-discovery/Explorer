<div mat-dialog-title>
    Concept browser
</div>

<div style="font-size: 14px">
  <mat-form-field appearance="outline">
    <mat-label>Search for terms</mat-label>
    <input matInput placeholder="Term" [(ngModel)]="term" (keyup)="searchTerm($event)">
  </mat-form-field>
</div>

<div style="height: 600px; overflow: auto;" class="flex" fxLayout="row wrap" fxLayoutAlign="start">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" fxFlex="100" fxFill matSort *ngIf="!wait">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef style="width: 200px">
        <mat-checkbox (change)="$event ? masterToggle() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()"
                      [aria-label]="checkboxLabel()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)"
                      [aria-label]="checkboxLabel(row)">
        </mat-checkbox>
      </td>
    </ng-container>
    <ng-container matColumnDef="originalCode">
      <th mat-header-cell *matHeaderCellDef style="width: 150px" mat-sort-header>Original code</th>
      <td mat-cell *matCellDef="let element" > {{element.originalCode}} </td>
    </ng-container>
    <ng-container matColumnDef="term">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Original term</th>
      <td mat-cell style="width: 450px; padding-right: 10px" *matCellDef="let element" > {{element.term}} </td>
    </ng-container>
    <ng-container matColumnDef="useCount">
      <th mat-header-cell *matHeaderCellDef style="width: 100px" mat-sort-header>Use count</th>
      <td mat-cell *matCellDef="let element" > {{element.useCount}} </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr style="cursor: pointer" mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <table style="height:300px">
    <tr *ngIf="wait">
      <td class="blink_me">
        Retrieving data.....
      </td>
    </tr>
  </table>

  <mat-paginator [length]="events?.length"
                 [pageSize]="size"
                 [pageIndex]="page"
                 [showFirstLastButtons]="true"
                 (page)="onPage($event)"
                 fxFlex="100"
                 fxFill>
  </mat-paginator>
</div>

<br/>
<div mat-dialog-actions align="end">
  <mat-form-field appearance="outline" style="font-size: 12px; margin-right: 15px;width: 450px">
    <mat-label>Value set name for these selected concepts</mat-label>
    <input required matInput placeholder="Value set name" [(ngModel)]="type" (ngModelChange)="formChanged()">
  </mat-form-field>
  <mat-form-field appearance="outline" style="font-size: 12px;margin-right: 50px; width: 250px">
    <mat-label>Data type for these selected concepts</mat-label>
    <mat-select [(ngModel)]="selectedDataType" (ngModelChange)="formChanged()" required>
      <mat-option *ngFor="let dataType of dataTypes" [value]="dataType.value">
        {{dataType.value}}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <button style="margin-right: 15px" mat-flat-button color="accent" [disabled]="disableForm" (click)="addConcepts()">Add selected concepts</button>
  <button style="margin-right: 15px" mat-flat-button color="accent" (click)="onCancelClick()">Close</button>
</div>
